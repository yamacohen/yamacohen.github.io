  var rsZ = 100;
  function rsDrag(board){
    var cur = null, sx = 0, sy = 0, ol = 0, ot = 0;
    board.addEventListener('pointerdown', function(e){
      if (e.pointerType === 'touch') return;
      var el = e.target.closest ? e.target.closest('.rs-d') : null; if (!el) return;
      cur = el; sx = e.clientX; sy = e.clientY; ol = el.offsetLeft; ot = el.offsetTop;
      el.style.zIndex = ++rsZ; el.classList.add('is-drag');
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      e.preventDefault();
    });
    board.addEventListener('pointermove', function(e){
      if (!cur) return;
      var bw = board.clientWidth, bh = board.clientHeight;
      var l = Math.max(-cur.offsetWidth * .4, Math.min(bw - cur.offsetWidth * .6, ol + e.clientX - sx));
      var t = Math.max(-cur.offsetHeight * .4, Math.min(bh - cur.offsetHeight * .6, ot + e.clientY - sy));
      cur.style.left = (l / bw * 100) + '%'; cur.style.top = (t / bh * 100) + '%';
    });
    function end(){ if (cur){ cur.classList.remove('is-drag'); cur = null; } }
    board.addEventListener('pointerup', end); board.addEventListener('pointercancel', end);
  }

      e.preventDefault();
      var i = +t.closest('.stk-row').getAttribute('data-i');
      var block = blockEls[stkRows[i].target];
      var y = 0;
      if (block){
        var off = isMobile() ? 60 : (stuckTop[i] || BASE);
        y = block.getBoundingClientRect().top + window.scrollY - off;
      }
      window.scrollTo({top: Math.max(0, y), behavior: 'smooth'});
    }
    leftCol.addEventListener('click', goToSection);
    leftCol.addEventListener('keydown', goToSection);

    content.addEventListener('load', relayout, true);
    window.__spy = update;
    measure();
    update();
    window.__remeasure = function(){ measure(); update(); };
  }

  (function(){
    var lb = document.createElement('div');
    lb.id = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-modal', 'true');
    lb.innerHTML = '<button class="lb-x" aria-label="Close">close</button><button class="lb-nav lb-prev" aria-label="Previous">prev</button><button class="lb-nav lb-next" aria-label="Next">next</button><div class="lb-body"><img alt=""><video controls playsinline></video></div>';
    document.body.appendChild(lb);
    var img = lb.querySelector('img'), vid = lb.querySelector('video'), body = lb.querySelector('.lb-body'), lastFocus = null, gal = [], gi = 0;
    function show(src, mode){
      var isVid = /\.mp4$/i.test(src);
      lb.className = 'on' + (mode === 'scroll' ? ' scroll' : '') + (gal.length > 1 ? ' gal' : '') + (isVid ? ' vid' : '');
      if (isVid){ img.removeAttribute('src'); vid.src = src; var pr = vid.play(); if (pr && pr.catch) pr.catch(function(){}); }
      else { vid.pause(); vid.removeAttribute('src'); vid.load(); img.src = src; }
      body.scrollTop = 0;
    }
    function open(src, mode, galName){
      lastFocus = document.activeElement;
      gal = []; gi = 0;
      if (galName){
        gal = Array.prototype.slice.call(document.querySelectorAll('[data-gallery="' + galName + '"]')).map(function(el){ return el.getAttribute('data-lb'); });
        gi = Math.max(0, gal.indexOf(src));
      }
      show(src, mode); document.body.style.overflow = 'hidden';
      lb.querySelector('.lb-x').focus();
    }
    function step(d){ if (gal.length < 2) return; gi = (gi + d + gal.length) % gal.length; show(gal[gi], 'fit'); }
    function close(){
      vid.pause(); vid.removeAttribute('src'); vid.load();
      lb.className = ''; document.body.style.overflow = '';
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
    document.addEventListener('click', function(e){
      var h = e.target.closest ? e.target.closest('.hs, .zoom, .sticker-wrap[data-lb]') : null;
      if (h){ open(h.getAttribute('data-lb'), h.getAttribute('data-mode'), h.getAttribute('data-gallery')); return; }
      if (!lb.classList.contains('on')) return;
      var t = e.target;
      if (t.classList.contains('lb-prev')){ step(-1); return; }
      if (t.classList.contains('lb-next')){ step(1); return; }
      if (t === lb || t === body || t === img || t.classList.contains('lb-x')) close();
    });
    var tx0 = null;
    lb.addEventListener('touchstart', function(e){ tx0 = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive: true});
    lb.addEventListener('touchend', function(e){
      if (tx0 === null || !lb.classList.contains('gal')) return;
      var dx = e.changedTouches[0].clientX - tx0; tx0 = null;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    }, {passive: true});
    document.addEventListener('keydown', function(e){
      if (!lb.classList.contains('on')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });
  })();

  var currentId = 'about';
  var topbarEl = document.querySelector('.topbar'), lastY = 0, navHidden = false;
  var setNav = function(hide){
    if (hide === navHidden || !topbarEl) return;
    navHidden = hide; topbarEl.classList.toggle('is-hidden', hide);
    document.documentElement.style.setProperty('--navoff', hide ? topbarEl.offsetHeight + 'px' : '0px');
  };
  window.addEventListener('scroll', function(){
    var y = window.scrollY, dy = y - lastY;
    if (y <= 2) setNav(false);
    else if (dy > 1) setNav(true);
    else if (dy < -6) setNav(false);
    if (Math.abs(dy) > 1) lastY = y;
    if (window.__spy) window.__spy();
  }, {passive: true});
  if (topbarEl) topbarEl.addEventListener('focusin', function(){ setNav(false); });
  var wasMobile = window.innerWidth <= 860;
  window.addEventListener('resize', function(){
    var m = window.innerWidth <= 860;
    if (m !== wasMobile){ wasMobile = m; render(currentId); return; }
    if (window.__remeasure) window.__remeasure();
  });

  render('about');
})();
</script>
